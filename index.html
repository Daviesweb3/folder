<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <h1>Book Finder</h1>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Enter a book name...">

        </div>

        <p id="message"></p>

        <div id="results"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
